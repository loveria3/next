<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 확인 퀴즈 🤖 | LEAD Next</title>
<style>
  :root{
    --bg1:#6a5cff; --bg2:#8f6bff; --bg3:#ff6ba6;
    --card:#ffffff; --ink:#1f2340; --good:#12b76a; --bad:#ff4d6d; --accent:#ffd23f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:16px; overflow-x:hidden;
  }
  .wrap{width:100%; max-width:880px;}
  .card{
    background:var(--card); border-radius:28px; padding:clamp(22px,4vw,44px);
    box-shadow:0 24px 60px rgba(30,20,80,.35); text-align:center;
    animation:pop .35s ease;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  h1{font-size:clamp(30px,6vw,58px); margin:.2em 0; line-height:1.15;}
  .sub{font-size:clamp(16px,2.4vw,22px); color:#5b5f7a; margin-bottom:1.2em;}
  .emoji{font-size:clamp(56px,12vw,110px); line-height:1; margin:.1em 0;}
  button{font-family:inherit; cursor:pointer; border:none;}
  .btn{
    background:var(--ink); color:#fff; font-size:clamp(20px,3.2vw,28px); font-weight:800;
    padding:.7em 1.6em; border-radius:999px; box-shadow:0 8px 0 rgba(0,0,0,.18);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .btn.big{margin-top:.4em;}
  /* topbar */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px;}
  .pill{background:#eef0ff; color:#4b3fd6; font-weight:800; padding:.45em 1em; border-radius:999px; font-size:clamp(15px,2.4vw,20px);}
  .pill.score{background:#fff3cc; color:#9a7400;}
  .progress{height:14px; background:#ecebff; border-radius:999px; overflow:hidden; margin-bottom:22px;}
  .bar{height:100%; width:0%; background:linear-gradient(90deg,#6a5cff,#ff6ba6); transition:width .4s;}
  .qnum{color:#8b8fb0; font-weight:800; letter-spacing:.05em; font-size:clamp(14px,2.2vw,18px); margin-bottom:.3em;}
  .question{font-size:clamp(24px,4.4vw,40px); font-weight:900; line-height:1.3; margin:.1em 0 .9em;}
  .opts{display:grid; gap:14px; grid-template-columns:1fr;}
  .opts.two{grid-template-columns:1fr 1fr;}
  .opt{
    background:#f4f5ff; border:3px solid transparent; border-radius:18px;
    padding:clamp(16px,2.8vw,26px); font-size:clamp(20px,3.2vw,30px); font-weight:800;
    color:var(--ink); transition:transform .08s, background .15s, border-color .15s;
    display:flex; align-items:center; justify-content:center; gap:.4em; min-height:74px;
  }
  .opt:hover{transform:translateY(-3px); background:#e9ebff;}
  .opt.correct{background:#d6f7e6; border-color:var(--good); animation:flash .5s;}
  .opt.wrong{background:#ffe0e7; border-color:var(--bad); animation:shake .45s;}
  .opt.dim{opacity:.45;}
  .opt:disabled{cursor:default;}
  @keyframes flash{0%,100%{filter:none}30%{filter:brightness(1.25)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .feedback{min-height:1.6em; margin-top:18px; font-size:clamp(20px,3.4vw,30px); font-weight:900;}
  .feedback.ok{color:var(--good);} .feedback.no{color:var(--bad);}
  .next{margin-top:14px;}
  .hidden{display:none!important;}
  .mute{position:fixed; top:14px; right:16px; background:rgba(255,255,255,.85); border-radius:999px;
    width:48px;height:48px; font-size:24px; display:flex;align-items:center;justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,.2);}
  .foot{margin-top:16px; color:#eee; font-size:13px; text-align:center; opacity:.9;}
  /* confetti */
  .confetti{position:fixed; top:-20px; width:12px;height:18px; z-index:5; will-change:transform; border-radius:2px;}
  .resultBig{font-size:clamp(44px,10vw,92px); font-weight:900; margin:.1em 0;}
</style>
</head>
<body>
<button class="mute" id="mute" title="소리 켜기/끄기">🔊</button>
<div class="wrap">
  <!-- START -->
  <section class="card" id="start">
    <div class="emoji">🤖✨</div>
    <h1>AI 확인 퀴즈</h1>
    <p class="sub">슬라이드 1~12에서 배운 내용, 다 같이 맞혀 볼까요?<br>문제는 총 <b>8개</b>! 준비됐나요?</p>
    <button class="btn big" onclick="startQuiz()">🚀 시작하기</button>
  </section>

  <!-- QUIZ -->
  <section class="card hidden" id="quiz">
    <div class="topbar">
      <span class="pill" id="progText">1 / 8</span>
      <span class="pill score" id="scoreText">⭐ 0점</span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="qnum" id="qType">문제</div>
    <div class="question" id="qText">질문</div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn next hidden" id="nextBtn" onclick="nextQ()">다음 →</button>
  </section>

  <!-- RESULT -->
  <section class="card hidden" id="result">
    <div class="emoji" id="resEmoji">🎉</div>
    <div class="resultBig" id="resScore">8 / 8</div>
    <h1 id="resMsg">참 잘했어요!</h1>
    <p class="sub" id="resSub"></p>
    <button class="btn big" onclick="restart()">🔁 다시 풀기</button>
  </section>

  <div class="foot">LEAD Next · AI와 함께하는 지역 발전 활동가</div>
</div>

<script>
/* ===== 문제 데이터 (모두 발표자료 슬라이드 1~12 기반) ===== */
const QUIZ = [
  { type:"O / X",
    q:"AI는 사람의 학습·추론·지각 능력을 컴퓨터가 흉내 내는 기술이다.",
    opts:["⭕ 맞다","❌ 아니다"], answer:0 },

  { type:"4지선다",
    q:"AI의 핵심 키워드가 <u>아닌</u> 것은?",
    opts:["데이터","알고리즘","판단과 결정","😴 낮잠"], answer:3 },

  { type:"4지선다",
    q:"2010년대 AI '폭발기'를 이끈 대표 사례는?",
    opts:["전문가 시스템","딥러닝과 알파고","튜링 테스트","스마트폰"], answer:1 },

  { type:"빈칸 채우기",
    q:"“AI가 백과사전이라면, AI 에이전트는 ○○○이다.”",
    opts:["수행비서","계산기","번역기","백과사전"], answer:0 },

  { type:"4지선다",
    q:"AI 에이전트가 일하는 순서로 옳은 것은?",
    opts:["지각 → 생각 → 행동","행동 → 생각 → 지각","생각 → 지각 → 행동","지각 → 행동 → 생각"], answer:0 },

  { type:"O / X",
    q:"목적지만 말하면 항공권 예약부터 일정표 작성까지 끝내는 여행 비서는 AI 에이전트의 예다.",
    opts:["⭕ 맞다","❌ 아니다"], answer:0 },

  { type:"4지선다",
    q:"강수량을 예측하고 홍수를 감지해 막아 주는 AI 에이전트는 어느 분야일까?",
    opts:["학습","코딩","농업","재난"], answer:3 },

  { type:"4지선다",
    q:"스스로 목표를 달성하기 위해 계획을 세우고 행동하는 AI를 무엇이라 할까?",
    opts:["AI 에이전트","알고리즘","데이터","튜링 테스트"], answer:0 },
];

let idx=0, score=0, locked=false, soundOn=true;
const $=id=>document.getElementById(id);

/* ===== 간단한 효과음 (Web Audio, 외부파일 없음) ===== */
let AC;
function beep(freq,dur,type){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(.18,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const dingUp=()=>{beep(660,.12);setTimeout(()=>beep(880,.18),110);};
const buzz=()=>beep(160,.28,"square");

$("mute").onclick=()=>{ soundOn=!soundOn; $("mute").textContent=soundOn?"🔊":"🔇"; };

function startQuiz(){ idx=0; score=0; $("start").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden"); render(); }

function render(){
  const item=QUIZ[idx]; locked=false;
  $("progText").textContent=(idx+1)+" / "+QUIZ.length;
  $("scoreText").textContent="⭐ "+score+"점";
  $("bar").style.width=((idx)/QUIZ.length*100)+"%";
  $("qType").textContent=item.type;
  $("qText").innerHTML=item.q;
  $("feedback").textContent=""; $("feedback").className="feedback";
  $("nextBtn").classList.add("hidden");
  const box=$("opts");
  box.className = "opts" + (item.opts.length===2 ? " two":"");
  box.innerHTML="";
  item.opts.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="opt"; b.innerHTML=t;
    b.onclick=()=>choose(i,b);
    box.appendChild(b);
  });
}

function choose(i,btn){
  if(locked) return; locked=true;
  const item=QUIZ[idx];
  const buttons=[...document.querySelectorAll("#opts .opt")];
  buttons.forEach(b=>b.disabled=true);
  if(i===item.answer){
    btn.classList.add("correct"); score++; dingUp();
    $("feedback").textContent="정답이에요! 🎉"; $("feedback").className="feedback ok";
    burst(14);
  }else{
    btn.classList.add("wrong"); buzz();
    buttons[item.answer].classList.add("correct");
    $("feedback").textContent="아쉬워요! 정답은 “"+strip(item.opts[item.answer])+"”";
    $("feedback").className="feedback no";
  }
  buttons.forEach((b,k)=>{ if(k!==i && k!==item.answer) b.classList.add("dim"); });
  $("scoreText").textContent="⭐ "+score+"점";
  $("bar").style.width=((idx+1)/QUIZ.length*100)+"%";
  $("nextBtn").textContent = (idx===QUIZ.length-1) ? "결과 보기 🏁" : "다음 →";
  $("nextBtn").classList.remove("hidden");
}
function strip(html){ const d=document.createElement("div"); d.innerHTML=html; return d.textContent; }

function nextQ(){
  idx++;
  if(idx>=QUIZ.length){ showResult(); }
  else render();
}

function showResult(){
  $("quiz").classList.add("hidden");
  const r=$("result"); r.classList.remove("hidden");
  $("resScore").textContent=score+" / "+QUIZ.length;
  let emo,msg,sub;
  if(score===QUIZ.length){emo="🏆";msg="완벽해요! AI 척척박사!";sub="8문제 전부 정답! 오늘 배운 걸 완전히 이해했어요.";}
  else if(score>=6){emo="🎉";msg="아주 잘했어요!";sub="조금만 더 복습하면 만점이에요!";}
  else if(score>=4){emo="💪";msg="잘하고 있어요!";sub="AI와 AI 에이전트의 차이, 한 번 더 볼까요?";}
  else {emo="🌱";msg="이제 시작이에요!";sub="다시 한 번 도전하면 훨씬 잘할 수 있어요!";}
  $("resEmoji").textContent=emo; $("resMsg").textContent=msg; $("resSub").textContent=sub;
  if(score>=6){ dingUp(); confettiRain(80); }
}
function restart(){ $("result").classList.add("hidden"); $("start").classList.remove("hidden"); }

/* ===== 색종이(컨페티) ===== */
const COLORS=["#ffd23f","#ff6ba6","#6a5cff","#12b76a","#00c2ff","#ff8f3f"];
function makeConfetti(x){
  const c=document.createElement("div"); c.className="confetti";
  c.style.left=(x??Math.random()*100)+"vw";
  c.style.background=COLORS[Math.random()*COLORS.length|0];
  c.style.transform="rotate("+(Math.random()*360)+"deg)";
  document.body.appendChild(c);
  const fall=1200+Math.random()*1400, drift=(Math.random()*2-1)*180;
  c.animate([{transform:c.style.transform+" translate(0,0)",opacity:1},
             {transform:"translate("+drift+"px,105vh) rotate(720deg)",opacity:.9}],
            {duration:fall,easing:"cubic-bezier(.2,.6,.4,1)"}).onfinish=()=>c.remove();
}
function confettiRain(n){ for(let i=0;i<n;i++) setTimeout(()=>makeConfetti(),i*22); }
function burst(n){ for(let i=0;i<n;i++) makeConfetti(35+Math.random()*30); }
</script>
</body>
</html>
